name: Plan version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable SemVer bump; auto asks Claude to classify merged changes.
        required: true
        type: choice
        default: auto
        options: [auto, patch, minor, major]

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout merged main and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Claude Code
        if: inputs.bump == 'auto'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Choose the version
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: bun --no-env-file scripts/release.ts --bump "$BUMP" > release-plan.json

      - name: Show the release plan
        shell: bash
        run: |
          {
            echo "## Quaz release plan"
            echo
            echo "- Source: \`$(jq -r .revision release-plan.json)\`"
            echo "- Bump: \`$(jq -r .bump release-plan.json)\`"
            echo "- Version: \`v$(jq -r .version release-plan.json)\`"
            echo "- Reason: $(jq -r .reason release-plan.json)"
            echo
            echo "Apply this plan in a normal release pull request. The image publishes after that pull request passes review and merges."
          } >> "$GITHUB_STEP_SUMMARY"
