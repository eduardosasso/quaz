name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Lint
        run: |
          bun run lint
          git diff --exit-code

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(jq -r .version package.json)"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          config=scripts/qa/config.json
          echo "bun=$(jq -r .bun "$config")" >> "$GITHUB_OUTPUT"
          echo "docker=$(jq -r .docker "$config")" >> "$GITHUB_OUTPUT"
          echo "op=$(jq -r .op "$config")" >> "$GITHUB_OUTPUT"
          echo "claude=$(jq -r .claude "$config")" >> "$GITHUB_OUTPUT"
          echo "playwright_mcp=$(jq -r .playwrightMcp "$config")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Quaz
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            BUN_VERSION=${{ steps.image.outputs.bun }}
            DOCKER_VERSION=${{ steps.image.outputs.docker }}
            OP_VERSION=${{ steps.image.outputs.op }}
            CLAUDE_VERSION=${{ steps.image.outputs.claude }}
            PLAYWRIGHT_MCP_VERSION=${{ steps.image.outputs.playwright_mcp }}
            SOURCE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

  tag:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the validated main image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          source="${IMAGE}:sha-${REVISION}"
          target="${IMAGE}:${VERSION}"
          attempts=60
          interval=30
          for ((attempt=1; attempt<=attempts; attempt++)); do
            if docker buildx imagetools inspect "$source" > /dev/null 2>&1; then
              break
            fi
            if ((attempt == attempts)); then
              echo "Validated main image did not publish for $REVISION" >&2
              exit 1
            fi
            sleep "$interval"
          done
          docker buildx imagetools create --tag "$target" "$source"
          source_digest="$(docker buildx imagetools inspect "$source" | awk '/^Digest:/ {print $2; exit}')"
          target_digest="$(docker buildx imagetools inspect "$target" | awk '/^Digest:/ {print $2; exit}')"
          test -n "$source_digest"
          test "$source_digest" = "$target_digest"
